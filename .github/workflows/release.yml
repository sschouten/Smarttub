name: Release

# Creates a GitHub release (and tag) automatically when the version in
# manifest.json changes on main and validation succeeded. HACS uses these
# releases to offer updates. The release notes come from CHANGELOG.md.

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(python3 -c 'import json;print(json.load(open("custom_components/smarttub/manifest.json"))["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md entry for $VERSION" >&2
            exit 1
          fi
          cat release_notes.md

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          body_path: release_notes.md
          make_latest: true
