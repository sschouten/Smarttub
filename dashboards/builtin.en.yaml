# SmartTub dashboard — built-in cards only (English)
#
# Paste into: Settings → Dashboards → Add dashboard → New dashboard from
# scratch → ⋮ → Edit dashboard → ⋮ → Raw configuration editor.
# Replace "jacuzzi_j_435" with your spa's entity prefix (search & replace).
# Reminder entities depend on your spa model; adjust the list if needed.
title: Hot tub
views:
  - title: Hot tub
    path: hot-tub
    icon: mdi:hot-tub
    type: sections
    max_columns: 3
    sections:
      # ---------------------------------------------------------- temperature
      - type: grid
        cards:
          - type: heading
            heading: Temperature
            icon: mdi:thermometer-water
            badges:
              - type: entity
                entity: binary_sensor.jacuzzi_j_435_api_connection
                show_state: true
                color: green
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.jacuzzi_j_435_api_connection
                state: "off"
            card:
              type: markdown
              content: >
                ⚠️ **SmartTub cloud is slow — showing the last known data.**
                {{ states('sensor.jacuzzi_j_435_consecutive_failed_polls') }} of
                {{ state_attr('sensor.jacuzzi_j_435_consecutive_failed_polls', 'failure_threshold') }}
                polls failed, last update
                {{ relative_time(states('sensor.jacuzzi_j_435_last_successful_poll') | as_datetime) }} ago.
          - type: thermostat
            entity: climate.jacuzzi_j_435_thermostat
            name: Water
            features:
              - type: climate-preset-modes
                style: buttons
                preset_modes:
                  - none
                  - eco
                  - day
                  - ready
          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            entities:
              - entity: climate.jacuzzi_j_435_thermostat
                name: Water

      # -------------------------------------------------------------- control
      - type: grid
        cards:
          - type: heading
            heading: Jets & lights
            icon: mdi:pump
          - type: tile
            entity: switch.jacuzzi_j_435_jet_p1
            name: Jets P1
            icon: mdi:pump
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: switch.jacuzzi_j_435_jet_p2
            name: Jets P2
            icon: mdi:pump
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: light.jacuzzi_j_435_light_1
            name: Light 1
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: light.jacuzzi_j_435_light_2
            name: Light 2
            tap_action:
              action: toggle
            grid_options:
              columns: 6
          - type: tile
            entity: switch.jacuzzi_j_435_circulation_pump
            name: Circulation pump
            icon: mdi:sync
            grid_options:
              columns: 12
          - type: heading
            heading: Status
            heading_style: subtitle
          - type: tile
            entity: sensor.jacuzzi_j_435_state
            name: State
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.jacuzzi_j_435_error
            name: Error
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.jacuzzi_j_435_ozone
            name: Ozone
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.jacuzzi_j_435_uv
            name: UV
            grid_options:
              columns: 6

      # ---------------------------------------------- filtration & maintenance
      - type: grid
        cards:
          - type: heading
            heading: Filtration & maintenance
            icon: mdi:air-filter
          - type: tile
            entity: sensor.jacuzzi_j_435_primary_filtration_cycle
            name: Primary filtration
            state_content:
              - state
              - start_hour
              - duration
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.jacuzzi_j_435_secondary_filtration_cycle
            name: Secondary filtration
            state_content:
              - mode
            grid_options:
              columns: 12
          - type: entities
            title: Days until maintenance
            state_color: true
            entities:
              - type: attribute
                entity: binary_sensor.jacuzzi_j_435_refresh_water_reminder
                attribute: days
                name: Refresh water
                suffix: d
                icon: mdi:water-sync
              - type: attribute
                entity: binary_sensor.jacuzzi_j_435_proclarity_reminder
                attribute: days
                name: ProClarity
                suffix: d
                icon: mdi:filter
              - type: attribute
                entity: binary_sensor.jacuzzi_j_435_proclarity_depth_reminder
                attribute: days
                name: ProClarity depth
                suffix: d
                icon: mdi:filter-variant
              - type: attribute
                entity: binary_sensor.jacuzzi_j_435_clearray_reminder
                attribute: days
                name: ClearRay
                suffix: d
                icon: mdi:lightbulb-on-outline

      # ------------------------------------------------------- cloud & polling
      - type: grid
        cards:
          - type: heading
            heading: SmartTub cloud
            icon: mdi:cloud-sync-outline
          - type: tile
            entity: binary_sensor.jacuzzi_j_435_api_connection
            name: API connection
            grid_options:
              columns: 6
          - type: tile
            entity: button.jacuzzi_j_435_refresh
            name: Refresh now
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.jacuzzi_j_435_refresh
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.jacuzzi_j_435_last_successful_poll
            name: Last successful poll
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.jacuzzi_j_435_consecutive_failed_polls
            name: Failed polls in a row
            grid_options:
              columns: 6
          - type: history-graph
            title: Poll duration (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.jacuzzi_j_435_last_poll_duration
                name: Poll duration
